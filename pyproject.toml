[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "owsm-trt"
version = "0.2.0"
description = "Fast OWSM (Open Whisper-style Speech Model) inference with TensorRT"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6",
    "tensorrt>=10.8",
    "numpy",
    "sentencepiece",
    "huggingface-hub",
    "pyyaml",
    "soundfile",
    "onnx",
    "onnxscript",
]

[project.scripts]
owsm-trt = "owsm_trt.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/owsm_trt"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
